<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor's Information</title>
</head>

<body>
    <form method="POST">
        <h2>Donor's Information</h2>
        <table>
            <tr>
                <td>
                    <label for="firstname">First Name*</label>
                </td>
                <td>
                    <input type="text" id="firstname" name="firstname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="lastname">Last Name*</label>
                </td>
                <td>
                    <input type="text" id="lastname" name="lastname">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="company">Company*</label>
                </td>
                <td>
                    <input type="text" id="company" name="company">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address1">Address 1*</label>
                </td>
                <td>
                    <input type="text" id="address1" name="address1">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="address2">Address 2</label>
                </td>
                <td>
                    <input type="text" id="address2" name="address2">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="city">City*</label>
                </td>
                <td>
                    <input type="text" id="city" name="city">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="state">State*</label>
                </td>
                <td>
                    <select id="state" name="state">
                        <option>Select a State</option>
                        <option>Dhaka</option>
                        <option>Rajshahi</option>
                        <option>Chittagong</option>
                        <option>Sylhet</option>
                        <option>Khulna</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="zipcode">Zip Code*</label>
                </td>
                <td>
                    <input type="number" id="zipcode" name="zipcode">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="country">Country*</label>
                </td>
                <td>
                    <select id="state" name="state">
                        <option>Select a Country</option>
                        <option>Bangladesh</option>
                        <option>India</option>
                        <option>Pakistan</option>
                        <option>Russia</option>
                        <option>China</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="phone">Phone</label>
                </td>
                <td>
                    <input type="number" id="phone" name="phone">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="fax">Fax</label>
                </td>
                <td>
                    <input type="number" id="fax" name="fax">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="email">Email*</label>
                </td>
                <td>
                    <input type="email" id="email" name="email">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="phone">Phone</label>
                </td>
                <td>
                    <input type="number" id="phone" name="phone">
                </td>
            </tr>
            <tr>
                <td>
                    <label>Donation Amount*(check a button or type in your amount)</label>
                </td>
                <td>
                    <input type="radio" name="donation" value="none">None
                    <input type="radio" name="donation" value="$50">$50
                    <input type="radio" name="donation" value="$75">$75
                    <input type="radio" name="donation" value="$100">$100
                    <input type="radio" name="donation" value="$250">$250
                    <input type="radio" name="donation" value="other">Other
                </td>
            </tr>
            <tr>
                <td>
                    <label for="otheramount">Other Amount$</label>
                </td>
                <td>
                    <input type="number" id="otheramount" name="otheramount">
                </td>
            </tr>
            <tr>
                <td>
                    <label for="recurringdonation">Recurring Donation(Check if yes)</label>
                </td>
                <td>
                    <input type="checkbox" value="recurringdonation">I am interested in giving on a regular basis.
                </td>
            </tr>
            <tr>
                <td>
                    <label for="monthlycredit">Mothnly Credit Card $</label>

                    <input type="number" id="monthlycredit" name="monthlycredit">

                    <label for="monthlycreditformonths">For</label>

                    <input type="number" id="monthlycreditformonths" name="monthlycreditformonths">
                    <label>Months</label>
                </td>
            </tr>
        </table>
    </form>
</body>

</html>
